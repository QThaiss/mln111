<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Gold gradient for main symbol -->
    <linearGradient id="gold" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#a07e2e"/>
      <stop offset="50%" stop-color="#c8a04a"/>
      <stop offset="100%" stop-color="#e4c36a"/>
    </linearGradient>
    <!-- Red accent gradient -->
    <linearGradient id="red" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0%" stop-color="#8a2020"/>
      <stop offset="100%" stop-color="#e05050"/>
    </linearGradient>
    <!-- Flame glow -->
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#c8a04a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c8a04a" stop-opacity="0"/>
    </radialGradient>
    <!-- Subtle outer glow -->
    <filter id="softglow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background glow circle -->
  <circle cx="256" cy="240" r="180" fill="url(#glow)"/>

  <!-- === MAIN SYMBOL: Flame + River + Unity === -->
  <g filter="url(#softglow)">

    <!-- Three flowing streams converging upward (dòng chảy lịch sử / khối đoàn kết) -->
    <!-- Left stream -->
    <path
      d="M168 380 Q180 320 200 280 Q220 240 240 200 Q250 175 256 150"
      stroke="url(#gold)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.5"
    />
    <!-- Center stream (boldest) -->
    <path
      d="M256 400 Q256 340 256 280 Q256 220 256 150"
      stroke="url(#gold)" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.7"
    />
    <!-- Right stream -->
    <path
      d="M344 380 Q332 320 312 280 Q292 240 272 200 Q262 175 256 150"
      stroke="url(#gold)" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.5"
    />

    <!-- Central flame / torch of knowledge -->
    <path
      d="M256 160
         Q236 130 240 105
         Q244 75 256 52
         Q268 75 272 105
         Q276 130 256 160Z"
      fill="url(#red)" opacity="0.9"
    />
    <!-- Inner flame highlight -->
    <path
      d="M256 148
         Q248 130 250 112
         Q253 90 256 72
         Q259 90 262 112
         Q264 130 256 148Z"
      fill="#e4c36a" opacity="0.8"
    />

    <!-- Upward diamond / star spark at flame tip -->
    <path
      d="M256 42 L260 52 L256 62 L252 52Z"
      fill="#e4c36a" opacity="0.9"
    />

    <!-- Three abstract figures (unity / quần chúng) -->
    <!-- Left figure -->
    <g opacity="0.85">
      <circle cx="196" cy="330" r="12" fill="url(#gold)"/>
      <path d="M196 342 Q196 365 196 380" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
      <path d="M182 358 L196 350 L210 358" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Center figure (larger, leader) -->
    <g opacity="1">
      <circle cx="256" cy="310" r="15" fill="url(#gold)"/>
      <path d="M256 325 Q256 355 256 375" stroke="url(#gold)" stroke-width="6" stroke-linecap="round"/>
      <path d="M238 345 L256 335 L274 345" stroke="url(#gold)" stroke-width="4" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Right figure -->
    <g opacity="0.85">
      <circle cx="316" cy="330" r="12" fill="url(#gold)"/>
      <path d="M316 342 Q316 365 316 380" stroke="url(#gold)" stroke-width="5" stroke-linecap="round"/>
      <path d="M302 358 L316 350 L330 358" stroke="url(#gold)" stroke-width="3.5" stroke-linecap="round" fill="none"/>
    </g>

    <!-- Connecting arc between figures (unity bond) -->
    <path
      d="M210 340 Q233 320 256 315 Q279 320 302 340"
      stroke="url(#gold)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.4"
      stroke-dasharray="4 6"
    />

    <!-- Base platform / foundation line -->
    <path
      d="M160 408 Q208 395 256 392 Q304 395 352 408"
      stroke="url(#gold)" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.35"
    />

    <!-- Outer decorative arcs (movement / progress) -->
    <path
      d="M140 300 Q130 250 150 200"
      stroke="url(#gold)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.2"
    />
    <path
      d="M372 300 Q382 250 362 200"
      stroke="url(#gold)" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.2"
    />
  </g>

  <!-- === TEXT: DÒNG CHẢY LỊCH SỬ === -->
  <text
    x="256" y="456"
    text-anchor="middle"
    font-family="'Cinzel', 'Georgia', serif"
    font-size="28"
    font-weight="700"
    letter-spacing="8"
    fill="#c8a04a"
    opacity="0.9"
  >DÒNG CHẢY</text>
  <text
    x="256" y="488"
    text-anchor="middle"
    font-family="'Cinzel', 'Georgia', serif"
    font-size="20"
    font-weight="400"
    letter-spacing="14"
    fill="#9a9588"
    opacity="0.7"
  >LỊCH SỬ</text>
</svg>
